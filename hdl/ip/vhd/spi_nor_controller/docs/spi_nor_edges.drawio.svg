<circle cx="470" cy="374" r="4.5" fill="#3f6b2f"/>
<path d="M550,300 L550,360" fill="none" stroke="#3f6b2f" stroke-dasharray="5 4"/>
<circle cx="550" cy="374" r="4.5" fill="#3f6b2f"/>
<text x="316" y="424" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#3f6b2f" text-anchor="start">rx sample point = rx_sample_taps x (clk/2) after the sclk rising edge; taps = 2 is 8ns.</text>
<text x="316" y="442" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#3f6b2f" text-anchor="start">It must land inside the shifted cell, so it is placed explicitly rather than taken on the edge.</text>
<text x="20" y="486" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#444444" text-anchor="start">sclk runs only in cs_assert / instruction / addr / dummy / wdata / rdata.  cs_deassert still drives the bus but must not clock:</text>
<text x="20" y="504" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#444444" text-anchor="start">the part counts edges to find the end of an instruction, so a single trailing edge makes an erase or a write enable be discarded.</text>
<text x="20" y="528" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#444444" text-anchor="start">Every pin-facing flop is duplicated with no internal fanout and packed into its IOB, which is what makes the round trip bounded and repeatable.</text>
