<text x="234" y="334" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#3f6b2f" text-anchor="start">round trip: clk to sclk pin, tCLQV, back to the flop</text>
<path d="M310,300 L310,360" fill="none" stroke="#3f6b2f" stroke-dasharray="5 4"/>
<circle cx="310" cy="374" r="4.5" fill="#3f6b2f"/>
